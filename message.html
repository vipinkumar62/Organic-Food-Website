<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>
    <style>
        .modal {
                display: flex;
                position: fixed;
                z-index: 1;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                overflow: auto;
            }

            .modal-content {
                background-color: #fefefe;
                margin: 5% auto;
                padding: 50px;
                border: 1px solid #888;
                width: 80%;
                border-radius: 5px;
            }

            .close {
                color: #aaaaaa;
                float: right;
                font-size: 28px;
                font-weight: bold;
            }

            .close:hover,
            .close:focus {
                color: #000;
                text-decoration: none;
                cursor: pointer;
            }

            button {
                background-color: #4caf50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            button:hover {
                background-color: #45a049;
            }

            input[type="text"],
            input[type="email"],

            textarea {
                width: 100%;
                padding: 10px;
                margin: 5px 0;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            textarea {
                height: 100px;
            }

            form {
                margin-top: 20px;
            }
        </style>
</head>
<body>
    <div id="contactModals" class="modal" style="background-color: #0000005c">
        <div class="modal-content">
            <span class="close"
                style="background-color: #0000005c;padding-right: 0.5rem;padding-left: 0.5rem;border-radius: 100%;color: black;"
                id="closeButton2">&times;</span>
            <u>
                <h2>Get In Touch</h2>
            </u>
            <form id="contactForms" action="https://api.web3forms.com/submit" method="POST">

                <input type="hidden" name="access_key" value="88b9aa06-a08b-4ecd-b99c-1e1c8a46b749">
                <label for="name" style="color: #048654;">Name :</label>
                <input type="text" name="name" placeholder="👨‍💼 Your Name" id="name" name="name" required>
                <label for="email" style="color: #048654;">Email-Id :</label>
                <input type="email" name="email" placeholder="📧 Enter Your Email-ID" id="email"
                    name="email" required>
                <label for="number" style="color: #048654;">Mobile No :</label>
                <input type="text" name="phone" placeholder="📱 Mobile No." id="email" name="email"
                    required>
                <label for="message" placeholder="📱 Mobile No." style="color: #048654;">Message:</label>
                <textarea id="message" type="text" name="message"
                    placeholder="✍️ Please! write your message and click on submit button.."
                    required></textarea>



                <button type="submit"
                    onclick="window.confirm('📝Note : Hello dear! Do you want to send me the message you wrote in my message box? If yes then press the 🆗 button.')">Submit</button><br><br>
                <marquee behavior="alternate" direction="right" style="color: #048654;"><span>Note: The
                        reply to your message will be sent to your mobile or email immediately. Please wait
                        for our reply.</span></marquee>
            </form>
        </div>
    </div>
</body>
</html>

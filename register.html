<script>
    window.addEventListener("load", function () {
      // Time to display the loading screen (in milliseconds)
      const loadingDuration = 2000; // 3 seconds

      // Function to hide the loading screen and show the main content
      function hideLoadingScreen() {
        const loadingScreen = document.getElementById("loading-screen");
        const mainContent = document.getElementById("main-content");

        // Hide the loading screen with a fade-out effect
        loadingScreen.style.opacity = "0";
        setTimeout(() => {
          loadingScreen.style.display = "none";
          mainContent.style.display = "block"; // Show the main content
        }, 500); // Match the duration of the fade-out effect
      }

      // Delay hiding the loading screen and showing the main content
      setTimeout(hideLoadingScreen, loadingDuration);
    });
  </script>
